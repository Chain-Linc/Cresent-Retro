<!DOCTYPE html>

<!-- This is where the emulator files reside: https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/ -->

<html>
    <head>
        <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1 user-scalable=no"/>
        
        <link rel="stylesheet" href="https://css.hackclub.com/theme.css">
        <link rel="stylesheet" href="https://css.hackclub.com/fonts.css">
        <meta name="theme-color" content="#ec3750">
        <meta name="msapplication-TileColor" content="#ec3750">

        <title>Thumby Emulator</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/uikit-3.7.3/css/uikit-dark.css" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/css/dark/main-dark.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/css/dark/emulator-dark.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/css/dark/play-emulator-dark.css">
        
        <!-- Replace This Before Ship -->
        <!--link rel="icon" type="image/png" href=""-->
        
        <style>
            .center-wrapper {
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                z-index: 9999; /* Keeps it on top of other content */
                
                /* Your original sizing dimensions */
                min-height: 100vh; 
                width: 50%;       
            }
        </style>
    </head>

    <body>
        <div class="center-wrapper" style="display: flex; justify-content: center; align-items: center; min-height: 100vh;"> 
            <div class="card" style="width: 100%; max-width: 400px; padding: 2rem; text-align: center; border-radius: 12px;"> 
                <h1 class="headline brand" style="margin-top: 0; margin-bottom: 1rem; font-size: 1.5rem; font-weight: 1000; color: var(--red);">Thumby Battlefield</span></h1> 
                
                <div style="
                width: 100%;
                height: 32px;
                background-color: var(--sunken); 
                border-radius: var(--radii-default); 
                position: relative; 
                display: flex; 
                align-items: center; 
                overflow: hidden;
                ">
                    <!-- Centered status text inside the bar -->
                    <button>Start Game</button>
                    <span class="status-text" style="position: absolute; left: 50%; transform: translateX(-50%); color: var(--black); font-weight: 1000; font-size: 14px; white-space: nowrap; padding: 0 12px;">
                        Files 50/100
                    </span>

                    <div style="
                        width: 0%;
                        height: 100%; 
                        background-color: var(--red); 
                        border-radius: var(--radii-default) 0 0 var(--radii-default); 
                        display: flex; 
                        align-items: center; 
                        justify-content: center;
                    "></div>
                </div>

            </div> 
        </div>
        <div style="position: fixed; top: 0; left: 0; z-index: 5; width: 100vw; height: 100vh; background-color: rgba(100, 100, 100, 0.5);"></div>


        <script src="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/rp2040js/dist/esm/rp2040.js" type="module"></script>
        <script src="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/js/ace/ace.js" type="text/javascript" charset="utf-8"></script>
        <script src="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/js/ace/ext-language_tools.js"></script>
        <script src="https://cdn.jsdelivr.net/gh/TinyCircuits/TinyCircuits-Thumby-Code-Editor@5b3710cc100a5e9aefeb627bb5b4e166abebc879/js/editor_wrapper.js"></script>
        <script src="play.js" type="module"></script>

        <div style="position: fixed; top: 0; left: 0; z-index: 0; width: 100vw; height: 100vh; background-color: var(--background);"></div>
    </body>
</html>
